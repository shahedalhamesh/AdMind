<!doctype html>
<html><head><meta charset="utf-8"><title>AdMind icons</title></head>
<body style="font-family:system-ui,sans-serif;background:#1b1f24;color:#eee;padding:24px">
<h3>AdMind app icon</h3>
<p>
  <label>Background <input id="bg" type="color" value="#0b1720"></label>
  <label style="margin-inline-start:16px">Brain <input id="fg" type="color" value="#ff7a66"></label>
</p>
<div id="prev" style="display:flex;gap:16px;align-items:flex-end;margin:18px 0"></div>
<button id="go" style="padding:10px 18px;font-size:15px;cursor:pointer">Save the 3 icons into a folder</button>
<p id="msg" style="color:#9fb3c0"></p>
<script>
const PATHS = [
  "M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z",
  "M9 13a4.5 4.5 0 0 0 3-4", "M12 13h4", "M12 8h8"
].map(d => new Path2D(d));

function render(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  x.fillStyle = document.getElementById("bg").value;
  x.fillRect(0, 0, size, size);
  x.save();
  x.translate(size / 2, size / 2);
  const s = (size * 0.52) / 24;
  x.scale(s, s);
  x.translate(-12, -12);
  x.strokeStyle = document.getElementById("fg").value;
  x.lineWidth = 1.8; x.lineCap = "round"; x.lineJoin = "round";
  PATHS.forEach(p => x.stroke(p));
  x.restore();
  return c;
}
function preview() {
  const box = document.getElementById("prev"); box.innerHTML = "";
  [180, 96, 48].forEach(n => { const c = render(n); c.style.borderRadius = "22%"; box.appendChild(c); });
}
document.getElementById("bg").oninput = preview;
document.getElementById("fg").oninput = preview;
preview();

document.getElementById("go").onclick = async () => {
  const files = [["icon-192.png", 192], ["icon-512.png", 512], ["apple-touch-icon.png", 180]];
  let dir = null;
  if (window.showDirectoryPicker) {
    try { dir = await showDirectoryPicker({ mode: "readwrite" }); } catch (e) { return; }
  }
  for (const [name, size] of files) {
    const blob = await new Promise(r => render(size).toBlob(r, "image/png"));
    if (dir) {
      const h = await dir.getFileHandle(name, { create: true });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      await new Promise(r => setTimeout(r, 500));
    }
  }
  document.getElementById("msg").textContent = "Done. 3 icons saved.";
};
</script>
</body></html>
