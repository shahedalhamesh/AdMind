[project]
name = "admind-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai[google-genai]>=1.15.28",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "pymupdf>=2.0",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
admind-agents = "admind_agents:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
